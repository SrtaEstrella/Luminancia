<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminancia</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>document.documentElement.classList.add('light')</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>Luminancia</h2>
    <div class="sidebar-header-actions">
    <button onclick="toggleLang()" id="langBtn" class="header-btn">中</button>
    <button onclick="toggleTheme()" id="themeBtn" class="header-btn"></button>
    </div>
  </div>
  <div class="sidebar-scroll">
  <div id="colorSection" class="card">
    <div class="card-header clk" id="colorHeader" onclick="var b=document.getElementById('colorBody');var s=b.style.display==='none';b.style.display=s?'':'none';this.closest('.card').classList.toggle('collapsed');this.textContent=(s?'▾':'▸')+' '+T.colorCustom"></div>
    <div id="colorBody">
      <div class="control-row">
        <span class="color-label" id="schemeLabel"></span>
        <button onclick="importJSON()" id="importJsonBtn" class="btn-sm"></button>
        <button onclick="doExport()" id="exportJsonBtn" class="btn-sm"></button>
      </div>
      <div class="control-row">
        <span class="color-label" id="colorCountLabel"></span>
        <select id="nColors" onchange="onNColorsChange()" class="sel"></select>
        <button onclick="randomizeColors()" id="randColorBtn" class="btn-sm"></button>
        <button onclick="randomizeSeq()" id="randSeqBtn" class="btn-sm"></button>
      </div>
      <div id="activeColors" class="color-swatches"></div>
      <div id="paletteGrid" style="display:none"></div>
      <div class="seq-section">
        <div><div class="seq-section-label" id="leftSeqLabel"></div><div id="lseqSlots" class="seq-slots"></div></div>
        <div><div class="seq-section-label" id="rightSeqLabel"></div><div id="rseqSlots" class="seq-slots"></div></div>
      </div>
      <div class="color-hint" id="paletteHint"></div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="params"></div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="doImport(event)">
  </div>
  <div class="sidebar-footer">
    <button onclick="resetAll()" id="resetBtn"></button>
    <button class="accent" onclick="exportWallpaper()" id="exportImgBtn"></button>
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <button onclick="zoomOut()" id="zoomOutBtn">-</button>
    <span class="zoomlbl" id="zoomlbl">65%</span>
    <button onclick="zoomIn()" id="zoomInBtn">+</button>
    <button onclick="zoomFit()" id="fitBtn"></button>
    <button onclick="zoom100()" title="100%">1:1</button>
    <span class="sep"></span>
    <span class="lbl" id="previewLabel"></span>
    <div id="viewMode"></div>
    <span class="sep"></span>
    <button onclick="clearMarker()" id="clearMarkerBtn"></button>
    <span class="sep"></span>
    <span class="lbl" id="refImageLabel"></span>
    <input type="file" id="refFile" accept="image/*" style="display:none" onchange="loadRef(event)">
    <button onclick="document.getElementById('refFile').click()" id="uploadBtn"></button>
    <button onclick="clearRef()" id="clearRefBtn" class="hidden"></button>
  </div>
  <div class="scroll-wrap" id="scrollWrap">
    <div class="columns" id="columns">
        <div class="col" id="cv-col">
            <canvas id="cv"></canvas>
            <canvas id="guidesCv"></canvas>
        </div>
      <div class="col" id="ref-col" style="display:none">
        <canvas id="refCv"></canvas>
      </div>
    </div>
  </div>
  <div class="foot" id="footer"></div>
</div>

<script src="js/config.js"></script>
<script src="js/params.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui-params.js"></script>
<script src="js/ui-preview.js"></script>
<script src="js/main.js"></script>
</body>
</html>
